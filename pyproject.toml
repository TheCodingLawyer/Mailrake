[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# NOTE: distribution name is still the working name; see README "Naming" before
# publishing to PyPI. The import package stays `gmail_unsub` either way.
name = "gmail-unsub"
dynamic = ["version"]
description = "Local-first Gmail control panel: unsubscribe in bulk and see where your storage went. Your email never leaves your machine."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sami" }]
keywords = ["gmail", "unsubscribe", "email", "storage", "privacy", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Utilities",
]

dependencies = [
    "google-auth>=2.27.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.120.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
gmail-unsub = "gmail_unsub.cli.app:run"

[project.urls]
Homepage = "https://github.com/samiatt/gmail-unsub"
Issues = "https://github.com/samiatt/gmail-unsub/issues"

[tool.hatch.version]
path = "gmail_unsub/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["gmail_unsub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
