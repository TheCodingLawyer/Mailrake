[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailrake"
dynamic = ["version"]
description = "Rake out your Gmail: unsubscribe in bulk and see where your storage went. Runs entirely on your machine."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sami" }]
keywords = ["gmail", "unsubscribe", "email", "storage", "privacy", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Utilities",
]

dependencies = [
    "google-auth>=2.27.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.120.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
mailrake = "mailrake.cli.app:run"

[project.urls]
Homepage = "https://github.com/TheCodingLawyer/Mailrake"
Issues = "https://github.com/TheCodingLawyer/Mailrake/issues"

[tool.hatch.version]
path = "mailrake/__init__.py"

[tool.hatch.build]
# The compiled frontend is gitignored (it is a build product), and hatchling
# honours .gitignore -- without this the published wheel ships with no UI.
artifacts = ["mailrake/server/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["mailrake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
